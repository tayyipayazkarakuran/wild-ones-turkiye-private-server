services:
  mongo:
    image: mongo:8.2.11-noble
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      DB_NAME: ${DB_NAME:-emu}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    build:
      context: .
      dockerfile: game/Dockerfile
    command: ["node", "scripts/init-db.js"]
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME:-emu}?authSource=${DB_NAME:-emu}
      DB_NAME: ${DB_NAME:-emu}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  game:
    build:
      context: .
      dockerfile: game/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME:-emu}?authSource=${DB_NAME:-emu}
      DB_NAME: ${DB_NAME:-emu}
      GAME_HOST: 0.0.0.0
      GAME_PORT: 8000
      ASSETS_DIR: /srv/web/assets/json
      IMAGES_DIR: /srv/web/images
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('net');const s=n.connect(8000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)\""]
      interval: 5s
      timeout: 4s
      retries: 20

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8085}:3000"
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME:-emu}?authSource=${DB_NAME:-emu}
      DB_NAME: ${DB_NAME:-emu}
      PORT: 3000
      GAME_HOST: game
      GAME_PORT: 8000
      ASSET_VERSION: ${ASSET_VERSION:-v26}
      SOCKET_TRACE: ${SOCKET_TRACE:-false}
    depends_on:
      game:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  mongo_data:
